<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- unsafe-eval/wasm-unsafe-eval + worker blob: are required by the D2
       diagram engine (WASM + eval'd ELK layout lib in a worker); frame-src for
       YouTube/Vimeo embeds; data: fonts appear inside rendered diagram SVGs. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: http: https:; font-src 'self' data:; media-src 'self' file:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com;" />
  <title>Legilo</title>
  <link rel="stylesheet" href="katex/katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-light mode-split">
  <div id="toolbar">
    <div class="toolbar-left" id="tabbar">
      <div id="tabs"></div>
      <button id="tab-add" title="New tab (Ctrl+N)">+</button>
    </div>
    <div class="toolbar-right">
      <button id="btn-insert" title="Insert markdown: headings, images, tables, code…">Insert ▾</button>
      <button id="btn-chat" title="Chat settings — the model that answers live in ```chat blocks">💬</button>
      <button id="btn-page" title="Cycle preview layout: flow / page / slides (Ctrl+Shift+P)">
        <span class="page-label">Flow</span>
      </button>
      <button id="btn-present" title="Presenter mode (F5) — slides split on ---">Present</button>
      <button id="btn-view" title="Cycle view: split / editor / preview (Ctrl+1/2/3)">
        <span class="view-label">Split</span>
      </button>
      <button id="btn-theme" title="Toggle dark theme (Ctrl+Shift+D)">
        <span class="theme-label">Dark</span>
      </button>
      <button id="btn-help" title="Markdown Guide — syntax examples and shortcuts">?</button>
    </div>
  </div>

  <div id="workspace">
    <div id="editor-pane"></div>
    <div id="divider" title="Drag to resize"></div>
    <div id="preview-pane">
      <article id="preview" class="markdown-body"></article>
    </div>
  </div>

  <div id="presenter" hidden>
    <div id="slide-stage">
      <article id="slide" class="markdown-body"></article>
    </div>
    <canvas id="ink-canvas"></canvas>
    <div id="slide-spotlight" hidden></div>
    <div id="slide-blackout" hidden></div>
    <div id="slide-progress" hidden><div id="slide-progress-bar"></div></div>
    <div id="slide-warn" hidden></div>
    <div id="presenter-hud">
      <button id="ink-pen" title="Draw on the slide (P) — a digital pen draws without toggling">✎</button>
      <button id="ink-color" title="Pen colour (C)">●</button>
      <button id="ink-erase" title="Eraser (E) — or use the pen's eraser end">⌫</button>
      <button id="ink-clear" title="Clear ink on this slide (X)">✧</button>
      <button id="ink-black" title="Black out the screen (B) — W for white">◼</button>
      <button id="ink-spot" title="Spotlight (S)">◎</button>
      <span class="hud-sep"></span>
      <button id="slide-prev" title="Previous (←)">‹</button>
      <span id="slide-counter">1 / 1</span>
      <button id="slide-next" title="Next (→)">›</button>
      <button id="presenter-exit" title="Exit (Esc)">✕</button>
    </div>
  </div>

  <div id="present-console" hidden>
    <div class="pc-slides">
      <div class="pc-slot">
        <span class="pc-label">Now</span>
        <div class="slide-card pc-card" id="pc-current"><div class="slide-card-content markdown-body"></div></div>
      </div>
      <div class="pc-slot">
        <span class="pc-label">Next</span>
        <div class="slide-card pc-card" id="pc-next"><div class="slide-card-content markdown-body"></div></div>
      </div>
    </div>
    <div class="pc-side">
      <div class="pc-timer">
        <span id="pc-elapsed" title="Elapsed — click to reset">00:00</span>
        <span id="pc-clock">--:--</span>
      </div>
      <div class="pc-notes" id="pc-notes"></div>
      <div class="pc-controls">
        <button id="pc-prev" title="Previous (PageUp)">‹</button>
        <span id="pc-counter">1 / 1</span>
        <button id="pc-next-btn" title="Next (PageDown)">›</button>
        <span class="hud-sep"></span>
        <button id="pc-black" title="Black out (B)">◼</button>
        <button id="pc-spot" title="Spotlight (S)">◎</button>
        <button id="pc-exit" title="Stop presenting (Esc)">✕ Stop</button>
      </div>
    </div>
  </div>

  <article id="print-root" class="markdown-body"></article>

  <div id="chat-settings" hidden>
    <div class="cs-dialog">
      <div class="cs-head">
        <strong>Chat settings</strong>
        <span id="cs-status" class="cs-status"></span>
        <button id="cs-close" title="Close">✕</button>
      </div>

      <label class="cs-field">Server
        <input id="cs-base" type="text" spellcheck="false"
               placeholder="http://localhost:11434/v1" />
      </label>
      <p class="cs-hint">Any OpenAI-compatible server: Ollama on this computer,
        a machine on your Tailscale network (<code>http://spark:11434/v1</code>),
        LM Studio, or a cloud endpoint.</p>

      <div class="cs-row">
        <label class="cs-field cs-grow">Model
          <select id="cs-model"></select>
        </label>
        <button id="cs-refresh" title="Reconnect and reload the model list">Reconnect</button>
      </div>

      <label class="cs-field">API key (optional)
        <input id="cs-key" type="password" placeholder="leave blank for a local or Tailscale server" />
      </label>

      <label class="cs-field">Instructions for the model
        <textarea id="cs-system" rows="4"
          placeholder="How should it answer? e.g. “You are a friendly biology tutor for grade 8. Answer in two short sentences.”"></textarea>
      </label>
      <p class="cs-hint">Used by every chat block. A single block can override it
        with its own <code>@system:</code> line.</p>

      <div class="cs-actions">
        <button id="cs-insert">Insert a chat block</button>
        <span class="cs-spacer"></span>
        <button id="cs-done" class="cs-primary">Done</button>
      </div>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
